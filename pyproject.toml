[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bitwall"
dynamic = ["version"]
description = "A sender's library for bitwall: cells computed here, streamed to a wall that paints them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodney Haywood" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# FunctionSource(arrays=...) and pictures on a video layer.
arrays = ["numpy"]
# The letters drawn as pictures: TILE and the outline fonts.
letters = ["pillow"]
# TmuxSource, which reads a tmux pane through a terminal emulator.
tmux = ["pyte"]
all = ["numpy", "pillow", "pyte"]

[project.urls]
Homepage = "https://github.com/iamrodos/bitwall"

[tool.hatch.version]
path = "bitwall/__init__.py"

# The library is the Python under bitwall/ and the fonts letters draws
# with. The receivers' programs, the painter's C and the Rust crates are
# built where they run, from a clone.
[tool.hatch.build.targets.wheel]
include = ["bitwall/**/*.py", "bitwall/fonts/*"]
exclude = ["bitwall/rust", "bitwall/receivers/*/target"]

[tool.hatch.build.targets.sdist]
include = ["bitwall/**/*.py", "bitwall/fonts/*", "LICENSE", "README.md", "pyproject.toml"]
exclude = ["bitwall/rust", "bitwall/receivers/*/target"]
