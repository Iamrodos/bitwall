# tmux config for the ascii sender's tmux server.
#
# The server is started with `-f` pointing here so it never reads
# ~/.tmux.conf. A display must look the same regardless of whose machine
# hosts it, and interactive settings (base-index, status bar, key tables,
# plugins) have no business on a wall.

set -g base-index 0
setw -g pane-base-index 0

set -g status off
set -g mouse off

# A dumb screen should never flash or beep.
set -g visual-bell off
set -g visual-activity off
set -g bell-action none

# Pane borders are what make it read as tmux. Same colour for active and
# inactive: there is no "current" pane on a display nobody types into.
set -g pane-border-status top
set -g pane-border-format '#[fg=colour117,bold] #{pane_title} #[default]'
set -g pane-border-style        'fg=colour74'
set -g pane-active-border-style 'fg=colour74'

set -g default-terminal 'tmux-256color'
set -g escape-time 0

# Panes that exit should stay visible showing their last output rather
# than silently collapsing the layout.
set -g remain-on-exit on

# Keep the session alive when the last display disconnects.
set -g destroy-unattached off
