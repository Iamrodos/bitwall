[package]
name = "bitwall-term"
version = "1.1.0"
edition = "2021"
description = "a bitwall wall on the terminal it runs in, on Windows, a Mac or Linux"
publish = false

[dependencies]
bitwall-receiver = { path = "../core-rs" }
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
